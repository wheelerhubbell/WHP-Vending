name: WHP public commerce probe
on:
  push:
    branches: [repair/autonomous-discovery-20260929]
    paths: [".github/workflows/market-public-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Recheck the live discovery repair without a payment
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,json,pathlib,time,urllib.request,urllib.error
          standing='https://whp-standing-live-production.up.railway.app'
          cdp='https://api.cdp.coinbase.com/platform/v2/x402'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          def check(name,url,body=None,extra=None):
              r={'check':name,'url':url,'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'controlled_probe':True,'payment_attempted':False}
              headers={'User-Agent':'WHP-Controlled-Discovery-Repair/1.0 (no-payment)','Accept':'application/json, text/event-stream'}
              if body is not None:headers['Content-Type']='application/json'
              if extra:headers.update(extra)
              data=None if body is None else (body if isinstance(body,bytes) else json.dumps(body).encode())
              req=urllib.request.Request(url,data=data,headers=headers,method='GET' if body is None else 'POST')
              try:
                  try:response=urllib.request.build_opener(NoRedirect).open(req,timeout=20)
                  except urllib.error.HTTPError as error:response=error
                  with response:
                      r['status']=response.status;r['payment_header_bytes']=len(response.headers.get('payment-required',''))
                      raw=response.read(300001);r['truncated']=len(raw)>300000
                      text=raw[:300000].decode('utf-8',errors='replace')
                      try:r['response']=json.loads(text)
                      except ValueError:r['body']=text[:4000]
              except Exception as error:r['error']=str(error)
              return r
          attempts=[]
          for _ in range(18):
              p=check('empty_json_probe',standing+'/v1/evaluations',{})
              attempts.append({'status':p.get('status'),'at':p['checked_at'],'error':p.get('error')})
              if p.get('status')==402:break
              time.sleep(5)
          results=[p,
              check('ready',standing+'/readyz'),
              check('empty_json_with_invalid_payment_refused',standing+'/v1/evaluations',{}, {'payment-signature':'NOT_A_PAYMENT'}),
              check('mcp_initialize',standing+'/mcp',{'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-11-25','capabilities':{},'clientInfo':{'name':'whp-controlled-repair','version':'1.0'}}}),
              check('cdp_validate',cdp+'/validate',{'resource':standing+'/v1/evaluations','method':'POST'}),
              check('cdp_merchant',cdp+'/discovery/merchant?payTo=0x1050eddd8282623b0c263ed6bdbd42370bbc28d3&limit=100&offset=0'),
              check('mcp_registry','https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.wheelerhubbell%2Fwhp-standing&limit=100')]
          by={r['check']:r for r in results}
          body=p.get('response',{});validation=by['cdp_validate'].get('response',{})
          evidence={'record_type':'WHP_CONTROLLED_UNPAID_DISCOVERY_VERIFICATION','expected_repair_commit':'da6ef6df862ae92e438fcf65de464ae042e04a5d','runtime_commit_independently_checked_here':False,'scope':'Standing discovery only; not payment settlement, demand, Vending deployment, or Justin purchasing power','live_payment_attempted':False,'empty_json_returns_402':p.get('status')==402,'discovery_only':body.get('extensions',{}).get('whp-standing',{}).get('info',{}).get('discovery_only'),'payment_authorized':body.get('extensions',{}).get('whp-standing',{}).get('info',{}).get('payment_authorized'),'empty_json_with_payment_refused':by['empty_json_with_invalid_payment_refused'].get('status')==400,'coinbase_valid':validation.get('valid'),'coinbase_simulation':validation.get('simulation'),'attempts':attempts,'results':results}
          path=pathlib.Path('evidence/discovery-repair-2026-09-29.json');path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(evidence,indent=2)+'\n')
          print('WHP_PUBLIC_REPAIR_EVIDENCE '+json.dumps(evidence,separators=(',',':')))
          PY
      - name: Preserve the exact public probe evidence on this isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/discovery-repair-2026-09-29.json
          git commit -m 'Record actual unpaid Standing discovery and Coinbase validation results'
          git push origin HEAD:repair/autonomous-discovery-20260929
